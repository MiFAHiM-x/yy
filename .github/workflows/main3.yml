name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          packages: tools platform-tools platforms;android-34 build-tools;34.0.0

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          cat local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la $ANDROID_HOME || true

      - name: Generate Gradle Wrapper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gradle
          gradle wrapper --gradle-version 8.4 --distribution-type bin
          chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew clean assembleDebug --no-daemon --stacktrace

      - name: Find APK
        run: |
          find . -name "*.apk" -type f
          ls -lh app/build/outputs/apk/debug/ || true

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Result-Browser-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error
